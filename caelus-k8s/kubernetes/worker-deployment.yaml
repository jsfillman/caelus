apiVersion: apps/v1
kind: Deployment
metadata:
  name: caelus-worker
  labels:
    app: caelus
    component: worker
spec:
  replicas: 8
  selector:
    matchLabels:
      app: caelus
      component: worker
  template:
    metadata:
      labels:
        app: caelus
        component: worker
    spec:
      containers:
      - name: worker
        image: caelus-worker:latest
        imagePullPolicy: IfNotPresent
        # No command/entrypoint override - using the script from Dockerfile
        args:
          - "--ip=0.0.0.0"
          - "--port=9000" 
          - "--sr=44100"
          - "--polyphony=1"
          - "--controller-ip=$(CONTROLLER_IP)"
          - "--jack-client-name=worker-$(POD_NAME)"
        env:
        - name: CONTROLLER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP  # Use host IP to reach the Mac controller
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        securityContext:
          privileged: true  # Required for audio devices
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        ports:
        - containerPort: 9000
          name: osc
          protocol: UDP
        volumeMounts:
        - name: presets-volume
          mountPath: /app/presets
        - name: audio-device
          mountPath: /dev/snd
      volumes:
      - name: presets-volume
        emptyDir: {}
      - name: audio-device
        hostPath:
          path: /dev/snd
---
apiVersion: v1
kind: Service
metadata:
  name: caelus-worker
  labels:
    app: caelus
    component: worker
spec:
  selector:
    app: caelus
    component: worker
  type: NodePort  # Expose as NodePort for Mac controller access
  ports:
  - port: 9000
    targetPort: osc
    nodePort: 30900
    name: osc
    protocol: UDP
